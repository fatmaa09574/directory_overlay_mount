[project]
name = "directory-overlay-mount"
version = "0.1.0"
description = "Overlays two directories into a single read-only view, showing upper-layer files over lower ones."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
